<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
  <title>Éditeur de schémas électrotechniques</title>
  <!-- <meta name="theme-color" content="#e6ebef"> -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schemelec">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>

<body>
  <style>
    /* Concept : table à dessin. Papier calque, encre bleu nuit, phases repérées par couleur (L1 orange, L2 vert, L3 bleu). */
    :root {
      --bg: #e6ebef;
      --paper: #fbfcfc;
      --grid: #d5dde3;
      --grid2: #bcc8d1;
      --panel: #f3f6f8;
      --panel2: #e9eef2;
      --line: #d0d9e0;
      --fg: #14202b;
      --muted: #56667a;
      --ink: #16263a;
      --ink2: #5a6e82;
      --accent: #1f5fbf;
      --accent-fg: #ffffff;
      --sel: #e8590c;
      --ok: #1b8a5a;
      --warn: #a96a00;
      --bad: #cf2f33;
      --l1: #d9791a;
      --l2: #25a06a;
      --l3: #8e2bcc;
      --pn: #135eeb;
      --pe: #8c9a00;
      --dc: #c0392b;
      --lamp: #ffd43b;
      --coil: #bcd6ff;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1016;
        --paper: #101a24;
        --grid: #1b2835;
        --grid2: #2a3b4b;
        --panel: #141e29;
        --panel2: #1b2733;
        --line: #27374a;
        --fg: #e4ebf1;
        --muted: #8b9cac;
        --ink: #d7e3ee;
        --ink2: #8aa0b5;
        --accent: #5ea4ff;
        --accent-fg: #06121f;
        --sel: #ff9a52;
        --ok: #3ecf8e;
        --warn: #f0b64d;
        --bad: #ff6b6e;
      --l1: #d9791a;
      --l2: #25a06a;
      --l3: #8e2bcc;
      --pn: #135eeb;
        --pe: #c5d63a;
        --dc: #ff7a66;
        --lamp: #ffd43b;
        --coil: #2a4a78;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1016;
      --paper: #101a24;
      --grid: #1b2835;
      --grid2: #2a3b4b;
      --panel: #141e29;
      --panel2: #1b2733;
      --line: #27374a;
      --fg: #e4ebf1;
      --muted: #8b9cac;
      --ink: #d7e3ee;
      --ink2: #8aa0b5;
      --accent: #5ea4ff;
      --accent-fg: #06121f;
      --sel: #ff9a52;
      --ok: #3ecf8e;
      --warn: #f0b64d;
      --bad: #ff6b6e;
      --l1: #d9791a;
      --l2: #25a06a;
      --l3: #8e2bcc;
      --pn: #135eeb;
      --pe: #c5d63a;
      --dc: #ff7a66;
      --lamp: #ffd43b;
      --coil: #2a4a78;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 var(--sans);
      overflow: hidden
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px
    }

    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-left: max(0px, env(safe-area-inset-left, 0px));
      padding-right: max(0px, env(safe-area-inset-right, 0px))
    }

    /* barre du haut */
    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px max(12px, env(safe-area-inset-left, 0px)) 6px max(12px, env(safe-area-inset-left, 0px));
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0
    }

    .brand svg {
      flex: none
    }

    .brand h1 {
      font: 600 14px var(--sans);
      margin: 0;
      letter-spacing: .01em;
      white-space: nowrap
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--panel2)
    }

    .seg button {
      border: 0;
      background: none;
      padding: 5px 12px;
      font-weight: 500;
      color: var(--muted)
    }

    .seg button.on {
      background: var(--accent);
      color: var(--accent-fg)
    }

    .seg button.on.simon {
      background: var(--ok);
      color: #fff
    }

    .tools {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
      margin-left: auto
    }

    .tb {
      border: 1px solid var(--line);
      background: var(--panel2);
      border-radius: 6px;
      padding: 4px 9px;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap
    }

    .tb:hover:not(:disabled) {
      border-color: var(--accent)
    }

    .tb:disabled {
      opacity: .4;
      cursor: default
    }

    .tb.on {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent)
    }

    .sep {
      width: 1px;
      height: 20px;
      background: var(--line);
      margin: 0 3px
    }

    .menu {
      position: relative
    }

    .menu>div {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      z-index: 30;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 250px;
      box-shadow: 0 8px 24px #0004;
      padding: 4px
    }

    .menu>div button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 7px 10px;
      border-radius: 5px
    }

    .menu>div button:hover {
      background: var(--panel2)
    }

    .menu small {
      display: block;
      color: var(--muted);
      font-size: 11px
    }

    /* zone principale */
    .app {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr) 296px
    }

    aside {
      background: var(--panel);
      overflow: auto;
      min-height: 0
    }

    #palette {
      border-right: 1px solid var(--line)
    }

    #side {
      border-left: 1px solid var(--line)
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: var(--paper)
    }

    #cv {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
      user-select: none;
      -webkit-user-select: none
    }

    .hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      color: var(--muted);
      max-width: calc(100% - 20px);
      pointer-events: none
    }

    .alerts {
      position: absolute;
      left: 10px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: min(420px, calc(100% - 20px));
      pointer-events: none
    }

    .al {
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid;
      background: var(--panel)
    }

    .al.bad {
      color: var(--bad);
      border-color: var(--bad)
    }

    .al.warn {
      color: var(--warn);
      border-color: var(--warn)
    }

    .al.info {
      color: var(--muted);
      border-color: var(--line)
    }

    /* palette */
    .search {
      position: sticky;
      top: 0;
      background: var(--panel);
      padding: 8px;
      border-bottom: 1px solid var(--line);
      z-index: 2
    }

    .search input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 6px;
      padding: 6px 8px
    }

    .cat {
      padding: 8px 8px 2px
    }

    .cat h3 {
      margin: 0 0 5px;
      font: 600 10.5px var(--sans);
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted)
    }

    .items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px
    }

    .it {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 6px;
      padding: 4px 3px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center;
      min-width: 0
    }

    .it:hover {
      border-color: var(--accent)
    }

    .it.on {
      border-color: var(--sel);
      box-shadow: 0 0 0 1px var(--sel)
    }

    .it svg {
      width: 100%;
      height: 46px
    }

    .it span {
      font-size: 10.5px;
      line-height: 1.15;
      color: var(--fg);
      overflow-wrap: anywhere
    }

    /* panneau latéral */
    .pan {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .pan h2 {
      margin: 0;
      font: 600 12px var(--sans);
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted)
    }

    .fld {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .fld label {
      font-size: 11.5px;
      color: var(--muted)
    }

    .fld input,
    .fld select {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 6px;
      padding: 5px 7px;
      min-width: 0;
      width: 100%
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap
    }

    .row>* {
      min-width: 0
    }

    .tgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px
    }

    .tgrid .fld label {
      font-family: var(--mono)
    }

    .empty {
      color: var(--muted);
      line-height: 1.5
    }

    .empty b {
      color: var(--fg)
    }

    kbd {
      font: 500 11px var(--mono);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 4px
    }

    .ctl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--line)
    }

    .ctl b {
      font-weight: 600
    }

    .ctl small {
      display: block;
      color: var(--muted)
    }

    .chip {
      font: 500 11px var(--mono);
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--panel2);
      border: 1px solid var(--line);
      white-space: nowrap
    }

    .chip.on {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok)
    }

    .chip.bad {
      background: var(--bad);
      color: #fff;
      border-color: var(--bad)
    }

    .chip.warn {
      background: var(--warn);
      color: #fff;
      border-color: var(--warn)
    }

    .cbtn {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 6px;
      padding: 5px 10px;
      min-width: 92px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none
    }

    .cbtn:hover {
      border-color: var(--accent)
    }

    .cbtn.act {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent)
    }

    .bar {
      height: 5px;
      border-radius: 3px;
      background: var(--panel2);
      overflow: hidden;
      margin-top: 3px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent)
    }

    .pos3 {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden
    }

    .pos3 button {
      border: 0;
      background: var(--paper);
      padding: 4px 9px;
      border-right: 1px solid var(--line)
    }

    .pos3 button:last-child {
      border-right: 0
    }

    .pos3 button.on {
      background: var(--accent);
      color: var(--accent-fg)
    }

    /* SVG */
    .sy line,
    .sy path,
    .sy rect,
    .sy circle,
    .sy ellipse,
    .sy polyline {
      stroke: var(--ink);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .sy .dash {
      stroke: var(--ink2);
      stroke-dasharray: 3.5 3;
      stroke-width: 1.2
    }

    .sy .thin {
      stroke-width: 1.1
    }

    .sy .solid {
      fill: var(--ink)
    }

    .sy .coilon {
      fill: var(--coil)
    }

    .sy .hit {
      fill: transparent;
      stroke: none
    }

    .sy .bad {
      stroke: var(--bad)
    }

    .tl {
      font: 500 8px var(--mono);
      fill: var(--ink2)
    }

    .cl {
      font: 600 11px var(--sans);
      fill: var(--ink)
    }

    .cl.miss {
      fill: var(--bad)
    }

    .cn {
      font: 400 9px var(--sans);
      fill: var(--ink2)
    }

    .big {
      font: 500 15px var(--sans);
      fill: var(--ink)
    }

    .mid {
      font: 500 10px var(--sans);
      fill: var(--ink)
    }

    .bus {
      font: 500 9px var(--mono);
      fill: var(--ink2)
    }

    .wire {
      stroke: var(--ink);
      stroke-width: 1.4;
      fill: none;
      stroke-linejoin: round
    }

    .wire.live {
      stroke-width: 2.2
    }

    .wirehit {
      stroke: transparent;
      stroke-width: 12;
      fill: none;
      cursor: pointer
    }

    .wire.sel {
      stroke: var(--sel);
      stroke-width: 2.4
    }

    .wl {
      font: 500 8.5px var(--mono);
      fill: var(--accent);
      paint-order: stroke;
      stroke: var(--paper);
      stroke-width: 3.5px;
      stroke-linejoin: round
    }

    .jd {
      fill: var(--ink)
    }

    .tm {
      fill: var(--paper);
      stroke: var(--ink2);
      stroke-width: 1
    }

    .tm.use {
      fill: var(--ink2)
    }

    .tm {
      pointer-events: none
    }

    .tmh {
      fill: transparent;
      cursor: crosshair
    }

    .tmh:hover+.tm {
      stroke: var(--sel);
      fill: var(--sel)
    }

    .cmp {
      cursor: move
    }

    .cmp.op {
      cursor: pointer
    }

    .selbox {
      fill: none;
      stroke: var(--sel);
      stroke-width: 1;
      stroke-dasharray: 4 3
    }

    .mh.add {
      opacity: .6;
    }
    .mh {
      fill: var(--paper);
      stroke: var(--sel);
      stroke-width: 1.5;
      cursor: move
    }

    .marq {
      fill: #1f5fbf22;
      stroke: var(--accent);
      stroke-width: 1;
      stroke-dasharray: 4 3
    }

    .lamp-on {
      filter: drop-shadow(0 0 6px var(--lamp))
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes spinr {
      to {
        transform: rotate(-360deg)
      }
    }

    .rot {
      transform-box: fill-box;
      transform-origin: center
    }

    .rot.cw {
      animation: spin 1.1s linear infinite
    }

    .rot.ccw {
      animation: spinr 1.1s linear infinite
    }

    .rot.hum {
      animation: spin 6s linear infinite
    }

    @media (prefers-reduced-motion:reduce) {
      .rot {
        animation-duration: 4s !important
      }
    }

    /* modale export */
    .modal {
      position: fixed;
      inset: 0;
      background: #0007;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .modal>div {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      width: min(720px, 100%);
      max-height: 90%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px
    }

    .modal textarea {
      width: 100%;
      height: 260px;
      font: 12px var(--mono);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      resize: vertical
    }

    .modal h2 {
      margin: 0;
      font: 600 15px var(--sans)
    }

    .tabs {
      display: none
    }

    @media (max-width:900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto
      }

      #palette,
      #side,
      .stage {
        grid-area: 1/1
      }

      #palette,
      #side {
        border: 0
      }

      body[data-tab="draw"] #palette,
      body[data-tab="draw"] #side {
        display: none
      }

      body[data-tab="sym"] .stage,
      body[data-tab="sym"] #side {
        display: none
      }

      body[data-tab="info"] .stage,
      body[data-tab="info"] #palette {
        display: none
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0px)
      }

      .tabs button {
        border: 0;
        background: none;
        padding: 10px 4px;
        font-weight: 500;
        color: var(--muted)
      }

      .tabs button.on {
        color: var(--accent);
        box-shadow: inset 0 2px 0 var(--accent)
      }

      .items {
        grid-template-columns: repeat(3, 1fr)
      }

      .brand h1 {
        font-size: 13px
      }

      .tools .lbl {
        display: none
      }
    }
  </style>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <rect x="1" y="1" width="24" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M13 3v6M13 17v6M13 9l-5 4M8 13h0M13 9v8" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" />
          <circle cx="13" cy="9" r="1.6" fill="currentColor" />
        </svg>
        <h1>Schémas électrotechniques</h1>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button id="mEdit" class="on" type="button">Édition</button>
        <button id="mSim" type="button">Simulation</button>
      </div>
      <div class="tools" id="tools">
        <button class="tb" id="bUndo" type="button" title="Annuler (Ctrl+Z)">↶<span class="lbl"> Annuler</span></button>
        <button class="tb" id="bRedo" type="button" title="Rétablir (Ctrl+Y)">↷</button>
        <span class="sep"></span>
        <button class="tb" id="bRot" type="button" title="Pivoter (R)">⟳<span class="lbl"> Pivoter</span></button>
        <button class="tb" id="bDup" type="button" title="Dupliquer (Ctrl+D)">⧉<span class="lbl">
            Dupliquer</span></button>
        <button class="tb" id="bDel" type="button" title="Supprimer (Suppr)">✕<span class="lbl">
            Supprimer</span></button>
        <span class="sep"></span>
        <button class="tb" id="bZm" type="button" title="Zoom arrière">−</button>
        <button class="tb" id="bFit" type="button" title="Tout voir">⤢<span class="lbl"> Tout voir</span></button>
        <button class="tb" id="bZp" type="button" title="Zoom avant">+</button>
        <button class="tb" id="bGrid" type="button" title="Afficher ou masquer la grille" aria-pressed="true">▦<span class="lbl"> Grille</span></button>
        <span class="sep"></span>
        <button class="tb" id="bNum" type="button" title="Numéroter les fils par potentiel">№<span class="lbl">
            Numéroter les fils</span></button>
        <div class="menu"><button class="tb" id="bEx" type="button" aria-haspopup="true">Exemples ▾</button>
          <div id="mEx" hidden></div>
        </div>
        <button class="tb" id="bIO" type="button">⇅<span class="lbl"> Export / import</span></button>
        <button class="tb" id="bNew" type="button" title="Page blanche">Nouveau</button>
        <button class="tb" id="bInstall" type="button" title="Installer l’application">Installer</button>
      </div>
    </header>
    <div class="app">
      <aside id="palette"></aside>
      <section class="stage">
        <svg id="cv" role="application" aria-label="Zone de dessin du schéma"></svg>
        <div class="alerts" id="alerts"></div>
        <div class="hint" id="hint"></div>
      </section>
      <aside id="side">
        <div class="pan" id="panel"></div>
      </aside>
    </div>
    <nav class="tabs" id="tabs"><button data-tab="sym" type="button">Symboles</button><button data-tab="draw"
        type="button" class="on">Schéma</button><button data-tab="info" type="button">Propriétés</button></nav>
  </div>
  <div class="modal" id="modal" hidden>
    <div>
      <h2>Export / import</h2>
      <p class="empty" style="margin:0">Enregistrez le schéma au format JSON, ou importez un fichier JSON précédemment exporté. Vous pouvez également télécharger le dessin en SVG ou en PNG.</p>
      <input id="ioFile" type="file" accept=".json,application/json" hidden>
      <div class="row">
        <button class="tb" id="ioSave" type="button">Enregistrer le schéma (JSON)</button>
        <button class="tb" id="ioLoad" type="button">Importer un fichier JSON</button>
        <button class="tb" id="ioSvg" type="button">Exporter en SVG</button>
        <button class="tb" id="ioPng" type="button">Exporter en PNG</button>
        <span id="ioMsg" class="empty" aria-live="polite"></span>
        <button class="tb" id="ioClose" type="button" style="margin-left:auto">Fermer</button>
      </div>
    </div>
  </div>
  <script>
    'use strict';
    /* ===== Utilitaires ===== */
    // Récupère le premier élément de la page correspondant au sélecteur CSS fourni.
    const $ = s => document.querySelector(s);
    // Échappe les caractères spéciaux pour insérer une valeur sans risque dans du HTML.
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    // Construit le balisage SVG d'un segment de droite, avec classe CSS facultative.
    const ln = (a, b, c, d, k) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${k ? ` class="${k}"` : ''}/>`;
    // Construit le balisage SVG d'un rectangle, avec classe et style facultatifs.
    const rc = (x, y, w, h, k, st) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${k ? ` class="${k}"` : ''}${st ? ` style="${st}"` : ''}/>`;
    // Construit le balisage SVG d'un cercle, avec classe et style facultatifs.
    const ci = (x, y, r, k, st) => `<circle cx="${x}" cy="${y}" r="${r}"${k ? ` class="${k}"` : ''}${st ? ` style="${st}"` : ''}/>`;
    // Construit le balisage SVG d'un tracé, avec classe et style facultatifs.
    const pa = (d, k, st) => `<path d="${d}"${k ? ` class="${k}"` : ''}${st ? ` style="${st}"` : ''}/>`;
    // Applique une rotation par quart de tour à un point autour de l'origine.
    const rotPt = (x, y, r) => { switch (r & 3) { case 0: return [x, y]; case 1: return [-y, x]; case 2: return [-x, -y]; default: return [y, -x]; } };
    const POTCOL = { L1: 'var(--l1)', L2: 'var(--l2)', L3: 'var(--l3)', N: 'var(--pn)', PE: 'var(--pe)' };
    // Renvoie la couleur associée à un potentiel, ou la couleur par défaut.
    const potColor = n => POTCOL[n] || 'var(--dc)';
    const LAMPCOL = { vert: '#2fd27a', rouge: '#ff4d4f', orange: '#ff9f1a', blanc: '#fff3c4', bleu: '#4aa3ff', jaune: '#ffd43b' };

    // Limite le nombre de pôles d'un composant à la plage prise en charge.
    const nPoles = c => Math.max(1, Math.min(4, +c.props.n || 1));
    // Décrit les bornes d'entrée et de sortie des pôles d'un appareil multipolaire.
    function pTerms(n, h) {
      h = h || 60; const a = [];
      for (let i = 0; i < n; i++)a.push({ id: String(2 * i + 1), x: 20 * i, y: 0, d: [0, -1], l: String(2 * i + 1) });
      for (let i = 0; i < n; i++)a.push({ id: String(2 * i + 2), x: 20 * i, y: h, d: [0, 1], l: String(2 * i + 2) });
      return a;
    }
    // Dessine le contact mobile selon son état simulé et sa fonction NO ou NC.
    function blade(x, on, nc) {
      if (on === true) return ln(x, 40, x, 20);
      if (on === false) return ln(x, 40, x - 8, 20);
      return nc ? ln(x, 40, x - 8, 20) + ln(x - 8, 20, x, 20) : ln(x, 40, x - 8, 20);
    }

    // Renvoie l'état simulé de chacun des pôles, ou null hors simulation.
    const onList = (c, cx) => cx && cx.sim ? polesOf(c).map(p => p.on) : null;

    /* ===== Définitions des symboles (CEI 60617 / NF EN 60617) ===== */
    const DEFS = {};
    const PRE = { pre: '', refLabel: false };

    /* Appareils à n pôles : sectionneur, disjoncteurs, différentiel, contacteur (puissance) */
    // Crée la définition commune et le dessin des appareils de coupure multipolaires.
    function swDef(name, deco, head, extra) {
      return {
        name, def: { n: 3 }, props: [{ k: 'n', l: 'Nombre de pôles', t: 'sel', num: 1, o: [1, 2, 3, 4] }],
        terms: c => pTerms(nPoles(c)),
        bbox: c => [-16, -2, 20 * (nPoles(c) - 1) + 30, 62],
        draw(c, cx) {
          const n = nPoles(c), st = onList(c, cx); let s = '';
          for (let i = 0; i < n; i++) {
            const x = 20 * i;
            s += ln(x, 0, x, 20) + ln(x, 40, x, 60) + blade(x, st ? st[i] : undefined, false) + deco(x, st ? st[i] : undefined, i, n);
          }
          if (extra && extra.pre) s += extra.pre(n, c, cx, st);
          if (n > 1) s += ln(-4, 30, 20 * (n - 1) - 4, 30, 'dash');
          const ex = 20 * (n - 1);
          if (head) s += ln(ex - 4, 30, ex + 14, 30, 'dash') + head(ex + 14, cx, c);
          if (typeof extra === 'function') s += extra(n, c, cx);
          return { s, t: [] };
        }
      };
    }
    // Sectionneur : lames ouvertes vers le haut, poignée de manœuvre à gauche.
    DEFS.sect = {
      name: 'Sectionneur', pre: 'Q', def: { n: 3 },
      props: [{ k: 'n', l: 'Nombre de pôles', t: 'sel', num: 1, o: [1, 2, 3, 4] }],
      terms: c => pTerms(nPoles(c)),
      bbox: c => [-20, -2, 20 * (nPoles(c) - 1) + 30, 62],
      draw(c, cx) {
        const n = nPoles(c), st = onList(c, cx); let s = '';
        for (let i = 0; i < n; i++) {
          const x = 20 * i, on = st ? st[i] : false;
          s += ln(x, 0, x, 16) + ci(x, 19, 3) + ln(x - 3, 16, x + 3, 16) + ln(x, 40, x, 60) + (on ? ln(x, 40, x, 22) : ln(x, 40, x - 8, 22));
        }
        s += ln(-12, 20, -5, 46) + ci(-5, 49, 2.5) + ln(-9, 30, 20 * (n - 1) - 4, 30, 'dash');
        return { s, t: [] };
      }
    };
    DEFS.disj = Object.assign(swDef('Disjoncteur magnéto-thermique', () => ''), {
      terms: c => pTerms(nPoles(c), 70), bbox: c => [-16, -2, 20 * (nPoles(c) - 1) + 30, 72],
      pre: 'Q', prot: 1, def: { n: 3, cal: 16 }, props: [{ k: 'n', l: 'Nombre de pôles', t: 'sel', num: 1, o: [1, 2, 3, 4] }, { k: 'cal', l: 'Calibre (A)', t: 'num' }],
      draw(c, cx) {
        const n = nPoles(c), st = onList(c, cx); let s = '';
        for (let i = 0; i < n; i++) {
          const x = 20 * i;
          // croix de déclenchement, lame, puis bobine magnétique/élément thermique en créneau
          s += ln(x, 0, x, 20) + ln(x - 3, 8, x + 3, 14) + ln(x + 3, 8, x - 3, 14) + ln(x - 3, 18, x + 3, 18) + blade(x, st ? st[i] : undefined, false)
            + pa(`M${x},40 V42 H${x + 6} V48 H${x} V51 A4.55,4.55 0 0 1 ${x},60.1 V70`);
        }
        if (n > 1) s += ln(-4, 30, 20 * (n - 1) - 4, 30, 'dash');
        return { s, t: [] };
      }
    });
    // Disjoncteur moteur : symbole issu de disjoncteur.svg (coordonnées d'origine converties à l'échelle de l'éditeur).
    DEFS.disjmot = Object.assign(swDef('Disjoncteur moteur', () => ''), {
      pre: 'Q', prot: 1, def: { n: 3, cal: 10 }, props: [{ k: 'n', l: 'Nombre de pôles', t: 'sel', num: 1, o: [1, 2, 3, 4] }, { k: 'cal', l: 'Réglage (A)', t: 'num' }],
      terms: c => pTerms(nPoles(c), 90), bbox: c => [-32, -2, 20 * (nPoles(c) - 1) + 14, 94],
      draw(c, cx) {
        const n = nPoles(c), st = onList(c, cx);
        const X = v => +((v - 146.0049) * 4.5).toFixed(2), Y = v => +((v - 150.65375) * 4.385).toFixed(2);
        const L = (x1, y1, x2, y2, k) => ln(X(x1), Y(y1), X(x2), Y(y2), k);
        const w = 4.44087; let s = '';
        for (let i = 0; i < n; i++) {
          const a = 146.0049 + w * i, on = st ? st[i] : false, px = X(a);
          s += ln(px, 0, px, Y(153.517)) + L(a - 0.454, 153.186, a + 0.48, 154.166) + L(a + 0.48, 153.186, a - 0.454, 154.166)
            + (on ? ln(px, Y(153.517), px, Y(158.122)) : L(a - 1.395, 154.048, a + 0.037, 158.122))
            + pa(`M${X(a + 0.037)},${Y(158.122)} V${Y(160.315)} H${X(a + 1.211)} V${Y(161.664)} H${X(a + 0.037)} V${Y(162.526)}`)
            + rc(X(a - 2.092), Y(159.516), +(w * 4.5).toFixed(2), +(5.983 * 4.385).toFixed(2)) + L(a - 2.092, 162.526, a + 2.349, 162.526)
            + L(a - 2.092, 168.582, a + 2.349, 168.582) + ln(px, Y(168.582), px, 90)
            + `<text x="${X(a + 0.4)}" y="${Y(164.674)}" text-anchor="middle" style="font:8.7px monospace;fill:var(--ink);stroke:none">I&gt;</text>`;
        }
        const f = 146.0049, l = 146.0049 + w * (n - 1);
        s += L(f - 2.092, 165.499, f - 2.092, 168.582) + L(l + 2.349, 165.499, l + 2.349, 168.582)
          + L(143.379, 156.028, l - 1.338, 156.028, 'dash') + L(142.107, 157.338, 142.213, 163.971, 'dash') + L(142.213, 163.971, 143.913, 163.971, 'dash') + L(143.807, 161.024, 142.166, 161.05, 'dash')
          + rc(X(140.835), Y(154.717), +(2.543 * 4.5).toFixed(2), +(2.621 * 4.385).toFixed(2)) + L(142.107, 154.717, 142.107, 157.338) + L(140.835, 156.028, 143.378, 156.028)
          + L(139.278, 155.184, 139.304, 156.897) + L(140.835, 156.04, 139.291, 156.053);
        return { s, t: [] };
      }
    });
    DEFS.diff = Object.assign(swDef('Interrupteur différentiel', x => ln(x - 4, 6, x + 4, 14) + ln(x + 4, 6, x - 4, 14), x => ln(x, 23, x, 37) + rc(x + 3, 26, 7, 8),
      n => `<ellipse cx="${10 * (n - 1)}" cy="50" rx="${10 * (n - 1) + 8}" ry="4" class="thin"/>`), { pre: 'Q', def: { n: 4 }, props: [{ k: 'n', l: 'Nombre de pôles', t: 'sel', num: 1, o: [2, 4] }] });
    DEFS.kmp = Object.assign(swDef('Contacts de puissance', x => pa(`M${x},12 A4,4 0 0 0 ${x},20`), null), {
      refLabel: true, def: { n: 3, ref: '' },
      props: [{ k: 'n', l: 'Nombre de pôles', t: 'sel', num: 1, o: [1, 2, 3, 4] }, { k: 'ref', l: 'Repère de la bobine commandée', t: 'ref' }]
    });

    /* Fusibles : n éléments */
    DEFS.fuse = {
      name: 'Fusible', pre: 'F', prot: 1, def: { n: 3, cal: 16 },
      props: [{ k: 'n', l: 'Nombre de fusibles', t: 'sel', num: 1, o: [1, 2, 3, 4] }, { k: 'cal', l: 'Calibre (A)', t: 'num' }],
      terms: c => pTerms(nPoles(c)), bbox: c => [-10, -2, 20 * (nPoles(c) - 1) + 10, 62],
      draw(c, cx) {
        const n = nPoles(c); const blown = cx && cx.sim && cx.S.blown[c.id]; let s = '';
        for (let i = 0; i < n; i++) {
          const x = 20 * i;
          s += ln(x, 0, x, 18) + ln(x, 42, x, 60) + rc(x - 4, 18, 8, 24, blown ? 'bad' : '') + (blown ? ln(x, 18, x, 26, 'bad') + ln(x, 34, x, 42, 'bad') : ln(x, 18, x, 42));
        }
        return { s, t: [] };
      }
    };

    /* Relais thermique (éléments de puissance) */
    DEFS.thermal = {
      name: 'Relais thermique', pre: 'F', def: { n: 3 }, props: [],
      terms: c => pTerms(3), bbox: c => [-10, -2, 56, 62],
      draw(c, cx) {
        let s = ''; const tr = cx && cx.sim && cx.S.trip[c.id];
        for (let i = 0; i < 3; i++) { const x = 20 * i; s += ln(x, 0, x, 18) + ln(x, 42, x, 60) + pa(`M${x},18 V24 H${x + 4} V36 H${x} V42`); }
        s += rc(-10, 18, 60, 24);
        s += pa('M54,23 L54,37 L60,37', tr ? 'bad' : '');
        return { s, t: [] };
      }
    };

    /* Contact auxiliaire (13-14, 21-22, 55-56, 67-68, 95-96, 97-98) */
    // Choisit les repères de bornes correspondant au type de contact.
    const ctcNums = P => {
      const k = P.kind || 'aux', t = P.type || 'no';
      return (k === 'aux' || k === 'sw') ? (t === 'no' ? ['13', '14'] : ['21', '22']) : k === 'tmp' ? (t === 'no' ? ['67', '68'] : ['55', '56']) : (t === 'no' ? ['97', '98'] : ['95', '96']);
    };
    const ctcProps = [{ k: 'kind', l: 'Type de contact', t: 'sel', o: [['aux', 'Auxiliaire de contacteur, relais, télérupteur ou minuterie'], ['tmp', 'Temporisé (relais temporisé)'], ['th', 'Relais thermique'], ['sw', 'Auxiliaire de sectionneur / disjoncteur']] },
    { k: 'type', l: 'Fonction', t: 'sel', o: [['no', 'Normalement ouvert (NO)'], ['nc', 'Normalement fermé (NC)']] },
    { k: 'ref', l: 'Repère de l’appareil commandé', t: 'ref' }];
    DEFS.ctc = {
      name: 'Contact auxiliaire', refLabel: true, def: { kind: 'aux', type: 'no', ref: '' }, props: ctcProps,
      terms: c => { const n = ctcNums(c.props); return [{ id: 'a', x: 0, y: 0, d: [0, -1], l: n[0] }, { id: 'b', x: 0, y: 60, d: [0, 1], l: n[1] }]; },
      bbox: c => [-30, -2, 16, 62],
      draw(c, cx) {
        const P = c.props, st = onList(c, cx), nc = P.type === 'nc';
        let s = ln(0, 0, 0, 20) + ln(0, 40, 0, 60) + blade(0, st ? st[0] : undefined, nc) + ln(-4, 30, -9, 30, 'dash');
        if (P.kind === 'tmp') s += pa('M-12,23 A9,9 0 0 1 -12,37');
        else if (P.kind === 'th') s += rc(-18, 25, 9, 10);
        else if (P.kind === 'sw') s += ln(-9, 24, -9, 36) + ln(-9, 30, -16, 30) + ci(-18, 30, 2);
        return { s, t: [] };
      }
    };

    /* Appareils de commande à 1 contact : bouton, arrêt d'urgence, sélecteur, fin de course */
    // Crée la définition commune d'un organe de commande à un contact.
    function btnDef(name, head, pre, type, extra) {
      return Object.assign({
        name, pre, def: { type }, props: [{ k: 'type', l: 'Fonction', t: 'sel', o: [['no', 'Normalement ouvert (NO)'], ['nc', 'Normalement fermé (NC)']] }],
        terms: c => { const n = (c.props.type === 'nc') ? ['21', '22'] : ['13', '14']; return [{ id: 'a', x: 0, y: 0, d: [0, -1], l: n[0] }, { id: 'b', x: 0, y: 60, d: [0, 1], l: n[1] }]; },
        bbox: c => [-40, -2, 16, 62],
        draw(c, cx) {
          const st = onList(c, cx);
          const s = ln(0, 0, 0, 20) + ln(0, 40, 0, 60) + blade(0, st ? st[0] : undefined, c.props.type === 'nc') + ln(-4, 30, -14, 30, 'dash') + head;
          return { s, t: [] };
        }
      }, extra || {});
    }
    DEFS.btn = btnDef('Bouton-poussoir', pa('M-14,26 H-20 V34 H-14'), 'S', 'no');
    DEFS.estop = btnDef('Arrêt d’urgence', pa('M-15,22 A8,8 0 0 0 -15,38 Z'), 'S', 'nc', { props: [] });
    DEFS.sel = btnDef('Sélecteur 2 positions', ln(-14, 30, -24, 21) + ci(-14, 30, 2.2), 'S', 'no');
    DEFS.lsw = btnDef('Fin de course', ci(-18, 30, 4), 'B', 'no');
    DEFS.inter = {
      name: 'Interrupteur simple', pre: 'S', def: {}, props: [],
      terms: c => [{ id: 'a', x: 0, y: 0, d: [0, -1], l: '1' }, { id: 'b', x: 0, y: 60, d: [0, 1], l: '2' }],
      bbox: c => [-30, -2, 16, 62],
      draw(c, cx) {
        const on = cx && cx.sim ? !!cx.S.latch[c.id] : false;
        return { s: ln(0, 0, 0, 20) + ln(0, 40, 0, 60) + blade(0, on, false) + ln(-4, 30, -14, 30, 'dash') + ln(-14, 30, -20, 22) + ci(-14, 30, 2.2), t: [] };
      }
    };
    DEFS.vaetvient = {
      name: 'Interrupteur va-et-vient', pre: 'S', def: {}, props: [],
      terms: c => [{ id: 'com', x: 0, y: 0, d: [0, -1], l: 'L' }, { id: 'nav1', x: -20, y: 60, d: [0, 1], l: '1' }, { id: 'nav2', x: 20, y: 60, d: [0, 1], l: '2' }],
      bbox: c => [-34, -2, 34, 62],
      draw(c, cx) {
        const pos = cx && cx.sim ? (cx.S.pos[c.id] | 0) : 0;
        const target = pos ? 20 : -20;
        return { s: ln(0, 0, 0, 20) + ln(-20, 46, -20, 60) + ln(20, 46, 20, 60) + ln(0, 20, target, 46), t: [] };
      }
    };

    /* Sélecteur 3 positions : deux contacts NO (gauche / droite) */
    DEFS.sel3 = {
      name: 'Sélecteur 3 positions', pre: 'S', def: {}, props: [],
      terms: c => [{ id: 'a1', x: 0, y: 0, d: [0, -1], l: '13' }, { id: 'b1', x: 0, y: 60, d: [0, 1], l: '14' }, { id: 'a2', x: 40, y: 0, d: [0, -1], l: '23' }, { id: 'b2', x: 40, y: 60, d: [0, 1], l: '24' }],
      bbox: c => [-30, -2, 50, 62],
      draw(c, cx) {
        const st = onList(c, cx); let s = '';
        [0, 40].forEach((x, i) => { s += ln(x, 0, x, 20) + ln(x, 40, x, 60) + blade(x, st ? st[i] : undefined, false); });
        s += ln(36, 30, -10, 30, 'dash') + ln(-10, 30, -20, 21) + ci(-10, 30, 2.2);
        const pos = cx && cx.sim ? (cx.S.pos[c.id] | 0) : -1;
        return { s, t: cx && cx.sim ? [{ x: 20, y: 12, s: ['0', 'G', 'D'][pos], c: 'mid', a: 'middle' }] : [{ x: 20, y: 12, s: 'G · 0 · D', c: 'tl', a: 'middle' }] };
      }
    };

    /* Bobines */
    DEFS.coil = {
      name: 'Bobine de contacteur / relais', pre: 'KM', def: {}, props: [],
      terms: c => [{ id: 'a1', x: 0, y: 0, d: [0, -1], l: 'A1' }, { id: 'a2', x: 0, y: 60, d: [0, 1], l: 'A2' }],
      bbox: c => [-20, -2, 20, 62],
      draw(c, cx) {
        const on = cx && cx.sim && cx.S.coil[c.id];
        return { s: ln(0, 0, 0, 22) + ln(0, 38, 0, 60) + rc(-16, 22, 32, 16, on ? 'coilon' : ''), t: [] };
      }
    };
    DEFS.coilt = {
      name: 'Relais temporisé (travail)', pre: 'KT', def: { delay: 5 }, props: [{ k: 'delay', l: 'Temporisation (s)', t: 'num' }],
      terms: c => [{ id: 'a1', x: 0, y: 0, d: [0, -1], l: 'A1' }, { id: 'a2', x: 0, y: 60, d: [0, 1], l: 'A2' }],
      bbox: c => [-22, -2, 22, 62],
      draw(c, cx) {
        const on = cx && cx.sim && cx.S.coil[c.id];
        return {
          s: ln(0, 0, 0, 21) + ln(0, 39, 0, 60) + rc(-20, 21, 40, 18, on ? 'coilon' : '') + ln(-10, 21, -10, 39, 'thin') + ln(10, 21, 10, 39, 'thin'),
          t: [{ x: 24, y: 34, s: (c.props.delay || 0) + ' s', c: 'cn', a: 'start' }]
        };
      }
    };
    DEFS.telerupteur = {
      name: 'Télérupteur', pre: 'TL', def: {}, props: [],
      terms: c => [{ id: 'a1', x: 0, y: 0, d: [0, -1], l: 'A1' }, { id: 'a2', x: 0, y: 60, d: [0, 1], l: 'A2' }],
      bbox: c => [-22, -2, 22, 62],
      draw(c, cx) {

    // Dessine le schéma complet, ses fils, composants, sélections et indications temporaires.

    /* ===== Historique et sauvegarde ===== */

    function addComp(type, x, y, o) {

    // Crée un fil entre deux bornes, en ignorant les doublons et les auto-connexions.

    // Fait pivoter les composants sélectionnés d'un quart de tour.

    /* ===== Numérotation des fils par potentiel ===== */
    // Attribue automatiquement des repères aux fils partageant un même potentiel.
    function autoNumber(skip) {
      if (!skip) pushUndo(); const uf = new UF();

      doc.comps.forEach(c => { if (c.type === 'bornier') uf.u(tk(c.id, 'a'), tk(c.id, 'b')); });

        const r = uf.f(tk(w.a.c, w.a.t)); if (!groups.has(r)) groups.set(r, { ws: [], pots: new Set(), y: 1e9, x: 1e9 }); const g = groups.get(r); g.ws.push(w);

      const list = [...groups.values()].sort((a, b) => a.y - b.y || a.x - b.x); let n = 1;

    /* ===== Moteur de simulation (réseau de contacts, relais à retard) ===== */
    // Crée l'état initial de tous les organes et indicateurs de la simulation.
    const freshS = () => ({ sw: {}, blown: {}, held: {}, latch: {}, pos: {}, trip: {}, coil: {}, tmr: {}, done: {}, timer: {}, timerInput: {}, tr: {}, log: [], speed: 1 });
    let S = freshS();
    let RES = { lamp: {}, motor: {}, alerts: [], potOf: () => [] };
    const PH = ['L1', 'L2', 'L3'];

    // Renvoie les bornes d'entrée et de sortie de chaque pôle d'un appareil.
    function polePairs(c) {
      const a = Array.from({ length: nPoles(c) }, (_, i) => [String(2 * i + 1), String(2 * i + 2)]);
      return a;
    }
    // Cherche un composant portant le repère indiqué et dont le type est autorisé.
    const findRef = (ref, types) => ref ? doc.comps.find(c => types.includes(c.type) && c.label === ref) : null;
    // Détermine les pôles conducteurs selon l'état de simulation des composants.
    function polesOf(c) {
      const P = c.props;

        case 'sect': case 'disj': case 'disjmot': case 'diff': { const on = S.sw[c.id] !== false; return polePairs(c).map(([a, b]) => ({ a, b, on })); }
        case 'fuse': return polePairs(c).map(([a, b]) => ({ a, b, on: !S.blown[c.id] }));
        case 'thermal': return [['1', '2'], ['3', '4'], ['5', '6']].map(([a, b]) => ({ a, b, on: true }));
        case 'kmp': { const k = findRef(P.ref, ['coil', 'coilt']); const on = !!(k && S.coil[k.id]); return polePairs(c).map(([a, b]) => ({ a, b, on })); }
        case 'ctc': {
          const nc = P.type === 'nc'; let on;
          if (P.kind === 'sw') { const q = findRef(P.ref, ['sect', 'disj', 'disjmot', 'diff']); const cl = !!(q && S.sw[q.id] !== false); on = nc ? !cl : cl; }
          else if (P.kind === 'th') { const th = findRef(P.ref, ['thermal']); const tr = !!(th && S.trip[th.id]); on = nc ? !tr : tr; }
          else {
            const k = findRef(P.ref, ['coil', 'coilt', 'telerupteur', 'minuterie']);
            let act = !!(k && (k.type === 'telerupteur' ? S.latch[k.id] : k.type === 'minuterie' ? S.timer[k.id] > 0 : S.coil[k.id]));
            if (P.kind === 'tmp') act = act && !!(k && k.type === 'coilt' && S.done[k.id]);

        case 'inter': return [{ a: 'a', b: 'b', on: !!S.latch[c.id] }];
        case 'vaetvient': { const pos = S.pos[c.id] | 0; return [{ a: 'com', b: 'nav1', on: pos === 0 }, { a: 'com', b: 'nav2', on: pos === 1 }]; }
        case 'estop': return [{ a: 'a', b: 'b', on: !S.latch[c.id] }];
        case 'sel3': { const p = S.pos[c.id] | 0; return [{ a: 'a1', b: 'b1', on: p === 1 }, { a: 'a2', b: 'b2', on: p === 2 }]; }

    // Construit les ensembles de bornes connectées et les liaisons conductrices actives.
    function buildNet() {

      doc.comps.forEach(c => polesOf(c).forEach(p => {

    // Trie et normalise les potentiels présents sur un même nœud électrique.
    function normPots(set) { const a = [...set]; if (a.includes('PE') && a.length > 1 && a.every(x => x === 'PE' || x === 'N')) return a.filter(x => x !== 'PE').sort(); return a.sort(); }

    // Détecte les courts-circuits et détermine le dispositif de protection déclenché.

        });

    // Déclenche un fusible ou un appareil de protection et consigne l'événement.
    function tripDev(d) {

    // Résout l'état électrique jusqu'à stabilisation, puis calcule les résultats affichables.
    function simSolve() {

        if (sh && sh.trip) { tripDev(sh.trip); continue; }
        let ch = false;
        for (const t of trs) { const w = energized(net, t, 'p1', 'p2'); if (w !== !!S.tr[t.id]) { S.tr[t.id] = w; ch = true; break; } }
        if (!ch) for (const c of coils) {
          const w = energized(net, c, 'a1', 'a2'), wasOn = !!S.coil[c.id];
          if (c.type === 'minuterie') {
            if (w && !S.timerInput[c.id]) S.timer[c.id] = Math.max(0, +c.props.delay || 0);
            S.timerInput[c.id] = w;
            if (w !== wasOn) { S.coil[c.id] = w; ch = true; break; }
            continue;
          }
          if (w !== wasOn) {
            S.coil[c.id] = w;
            if (c.type === 'telerupteur') { if (w) S.latch[c.id] = !S.latch[c.id]; }
            else if (!w) { S.tmr[c.id] = 0; S.done[c.id] = false; }
            ch = true; break;
          }
        }
        if (!ch) break;
      }
      RES = computeRes(net, unstable, findShort(net));
    }

    // Détermine si un moteur est alimenté et son état de fonctionnement.
    function motorStatus(net, c) {
      const p = t => { const a = potAt(net, c.id, t); return a.length === 1 ? a[0] : (a.length ? '#' : null); };
      const live = x => x && x !== 'PE' && x !== '#';
      if (c.type === 'mot1') {
        const a = p('u1'), b = p('u2');
        return live(a) && live(b) && a !== b ? { run: true, dir: 'cw', txt: 'en marche' } : { run: false, txt: (live(a) || live(b)) ? 'alimentation incomplète' : '' };
      }
      const sup = ['u1', 'v1', 'w1'].map(p);
      const okSup = sup.every(x => PH.includes(x)) && new Set(sup).size === 3;
      let dirTxt = '', dir = 'cw';
      if (okSup) { const i = sup.map(x => PH.indexOf(x)); const cw = i[1] === (i[0] + 1) % 3 && i[2] === (i[1] + 1) % 3; dir = cw ? 'cw' : 'ccw'; dirTxt = cw ? 'sens horaire' : 'sens anti-horaire'; }
      if (c.type === 'mot3') {
        if (okSup) return { run: true, dir, txt: dirTxt };
        const n = sup.filter(live).length;
        return { run: false, hum: n >= 2, txt: n ? 'phase manquante' : '' };
      }
      // mot3b : 6 bornes
      const e = ['u2', 'v2', 'w2'].map(p);
      const star = net.cond.f(tk(c.id, 'u2')) === net.cond.f(tk(c.id, 'v2')) && net.cond.f(tk(c.id, 'v2')) === net.cond.f(tk(c.id, 'w2')) && !e.some(x => x);
      if (okSup && star) return { run: true, dir, txt: 'étoile · ' + dirTxt, mode: 'Y' };
      if (okSup && e.every(x => PH.includes(x)) && e[0] !== sup[0] && e[1] !== sup[1] && e[2] !== sup[2]) return { run: true, dir, txt: 'triangle · ' + dirTxt, mode: 'D' };
      const n = sup.filter(live).length;
      return { run: false, hum: n >= 2, txt: n ? 'couplage incomplet' : '' };
    }

    // Calcule les états des récepteurs et les alertes de la simulation.
    function computeRes(net, unstable, sh) {
      const res = { lamp: {}, motor: {}, alerts: [], potOf: (c, t) => potAt(net, c, t) };
      doc.comps.forEach(c => {
        if (c.type === 'lamp') res.lamp[c.id] = energized(net, c, 'x1', 'x2');
        if (c.type === 'mot3' || c.type === 'mot3b' || c.type === 'mot1') res.motor[c.id] = motorStatus(net, c);
      });
      S.log.slice(-3).forEach(m => res.alerts.push({ k: 'bad', m }));
      if (sh && sh.unprot) res.alerts.push({ k: 'bad', m: 'Court-circuit entre ' + sh.pots.join(' et ') + ' : aucun dispositif de protection sur le trajet' });
      if (unstable) res.alerts.push({ k: 'warn', m: 'Commande instable : les contacts oscillent (vibration)' });
      doc.comps.forEach(c => { if (DEFS[c.type].refLabel && !c.props.ref) res.alerts.push({ k: 'warn', m: 'Un contact n’a pas de repère de bobine (point d’interrogation)' }); });
      const seen = new Set(); res.alerts = res.alerts.filter(a => !seen.has(a.m) && seen.add(a.m));
      return res;
    }

    /* ===== Actions de l'opérateur ===== */
    const OPS = ['btn', 'estop', 'sel', 'sel3', 'lsw', 'inter', 'vaetvient', 'sect', 'disj', 'disjmot', 'diff', 'fuse', 'thermal'];
    // Indique si un composant peut être actionné depuis la simulation.
    const isOperator = c => OPS.includes(c.type);
    let heldId = null;
    // Applique l'action d'un utilisateur sur un organe de commande simulé.
    function simDown(id, shift) {
      const c = byId(id); if (!c) return;
      switch (c.type) {
        case 'btn': if (shift) S.latch[id] = !S.latch[id]; else { S.held[id] = true; heldId = id; } break;
        case 'estop': case 'sel': case 'lsw': S.latch[id] = !S.latch[id]; break;
        case 'inter': S.latch[id] = !S.latch[id]; break;
        case 'vaetvient': S.pos[id] = 1 - (S.pos[id] | 0); break;
        case 'sel3': S.pos[id] = ((S.pos[id] | 0) + 1) % 3; break;
        case 'sect': case 'disj': case 'disjmot': case 'diff': S.sw[id] = !(S.sw[id] !== false); break;
        case 'fuse': S.blown[id] = !S.blown[id]; break;
        case 'thermal': S.trip[id] = !S.trip[id]; break;
      }
      simRefresh();
    }
    // Relâche un bouton-poussoir maintenu après un bref délai.
    function simUp() { if (!heldId) return; const id = heldId; heldId = null; setTimeout(() => { S.held[id] = false; simRefresh(); }, 130); }

    function simRefresh() { simSolve(); render(); renderPanel(); }
    // Réinitialise les états de simulation et redessine l'interface.
    function simReset() { S = freshS(); simSolve(); render(); renderPanel(); }
    // Met à jour périodiquement les temporisations des relais en mode simulation.
    setInterval(() => {
      if (mode !== 'sim') return; let ch = false, run = false; const dt = 0.1 * (S.speed || 1);
      doc.comps.forEach(c => {
        if (c.type === 'coilt' && S.coil[c.id] && !S.done[c.id]) {
          run = true; S.tmr[c.id] = (S.tmr[c.id] || 0) + dt;
          if (S.tmr[c.id] >= (+c.props.delay || 0)) { S.done[c.id] = true; ch = true; }
        } else if (c.type === 'minuterie' && S.timer[c.id] > 0) {
          run = true; S.timer[c.id] = Math.max(0, S.timer[c.id] - dt);
          if (S.timer[c.id] === 0) ch = true;
        }
      });
      if (ch) simRefresh();
      else if (run) doc.comps.forEach(c => {
        if (c.type === 'coilt') { const el = document.querySelector(`[data-tbar="${c.id}"]`); if (el) { const d = +c.props.delay || 1; el.style.width = Math.min(100, 100 * (S.tmr[c.id] || 0) / d) + '%'; } }

          const d = +c.props.delay || 1;
          const bar = document.querySelector(`[data-timer-bar="${c.id}"]`);
          const status = document.querySelector(`[data-timer-status="${c.id}"]`);
          if (bar) bar.style.width = Math.min(100, 100 * S.timer[c.id] / d) + '%';
          if (status) status.textContent = `${S.timer[c.id].toFixed(1)} s restantes`;
        }
      });
    }, 100);

    /* ===== Palette ===== */
    // Construit une vignette SVG pour un symbole de la palette.

    // Active ou désactive l'outil de placement et son aperçu sous le curseur.

    }
    // Met à jour le texte d'aide selon le mode et l'action en cours.
    function updHint() {

      if (mode === 'sim') h.textContent = 'Cliquez sur les boutons, sélecteurs et disjoncteurs pour piloter le schéma. Maintenez un bouton-poussoir enfoncé.';
      else if (tool) h.textContent = 'Cliquez dans le schéma pour placer « ' + tool.pr.name + ' ». Échap pour terminer.';
      else if (wiring) h.textContent = 'Cliquez sur la borne d’arrivée. Échap pour annuler.';
      else h.textContent = 'Glissez d’une borne à une autre pour tirer un fil. Molette : zoom. Glissez le fond : déplacer la vue.';
    }

    /* ===== Souris et tactile ===== */
    let spaceDown = false;
    // Place le symbole sélectionné sur la grille à la position demandée.
    function placeAt(p) {
      const pr = tool.pr; pushUndo(); const c = addComp(pr.t, snap(p[0]), snap(p[1]), { p: Object.assign({}, pr.p), label: pr.l, rot: ghost ? ghost.rot : 0 });
      selC = new Set([c.id]); selW = null; afterChange();
    }
    svg.addEventListener('pointerdown', e => {
      if (e.button === 2) return;
      const p = toWorld(e);
      if (mode === 'sim') {
        const el = e.target.closest('.cmp.op');
        if (el) { e.preventDefault(); simDown(el.dataset.c, e.shiftKey); return; }
        drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false }; return;
      }
      if (e.button === 1 || spaceDown) { drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: true }; return; }
      if (wiring && !drag) {
        const tm = nearestTerm(p[0], p[1], Math.max(8, 10 / view.k));
        if (tm) { pushUndo(); const w = addWire(wiring.from, tm); if (w) afterChange(); }
        wiring = null; hoverT = null; updHint(); render(); return;
      }
      if (tool) { drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, place: p }; return; }
      const vh = e.target.closest('[data-via]');
      if (vh) {
        const w = doc.wires.find(x => x.id === vh.dataset.via); if (!w) return; const vi = +vh.dataset.vi, now = Date.now();
        if (now - lastViaClick.t < 400 && lastViaClick.k === w.id + ':' + vi) { pushUndo(); w.via.splice(vi, 1); if (!w.via.length) delete w.via; lastViaClick = { t: 0, k: '' }; afterChange(); return; }
        lastViaClick = { t: now, k: w.id + ':' + vi }; pushUndo(); drag = { type: 'via', id: w.id, i: vi }; return;
      }
      const ah = e.target.closest('[data-addvia]');
      if (ah) {
        const w = doc.wires.find(x => x.id === ah.dataset.addvia), pp = w && wirePath(w); if (!pp) return;
        pushUndo(); const k = pp.pts.slice(0, +ah.dataset.seg + 1).filter(q => !pp.stubs.some(s => s[0] === q[0] && s[1] === q[1])).length - 1;
        w.via = pp.pts.filter((q, j) => j > 0 && j < pp.pts.length - 1 && !pp.stubs.some(s => s[0] === q[0] && s[1] === q[1]));
        w.via.splice(k, 0, [snap(p[0]), snap(p[1])]); drag = { type: 'via', id: w.id, i: k }; render(); return;
      }
      const mh = e.target.closest('[data-mid]');
      if (mh) { pushUndo(); drag = { type: 'mid', id: mh.dataset.mid }; return; }
      const tm = nearestTerm(p[0], p[1], Math.max(7, 9 / view.k));
      if (tm) { wiring = { from: tm, cur: p }; drag = { type: 'wire', sx: e.clientX, sy: e.clientY, moved: false }; hoverT = null; render(); return; }
      const ce = e.target.closest('.cmp');
      if (ce) {
        const id = ce.dataset.c;
        if (e.shiftKey) { selC.has(id) ? selC.delete(id) : selC.add(id); } else if (!selC.has(id)) { selC = new Set([id]); }
        selW = null;
        drag = { type: 'move', sx: p[0], sy: p[1], moved: false, orig: [...selC].map(i => { const c = byId(i); return [i, c.x, c.y]; }) };
        renderPanel(); render(); return;
      }
      const we = e.target.closest('[data-w]');
      if (we) { selW = we.dataset.w; selC = new Set(); renderPanel(); render(); return; }
      if (e.shiftKey) { drag = { type: 'marq', x0: p[0], y0: p[1], x1: p[0], y1: p[1] }; return; }
      drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, clear: true };
    });
    document.addEventListener('pointermove', e => {
      if (!svg.isConnected) return;
      const r = rectOf(); const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (drag) {
        if (drag.type === 'pan') {
          const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy; if (Math.hypot(dx, dy) > 4) drag.moved = true;
          if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; render(); }
        }
        else if (drag.type === 'move') {
          const p = toWorld(e); const dx = snap(p[0] - drag.sx), dy = snap(p[1] - drag.sy);
          if (!drag.moved && (dx || dy)) { pushUndo(); drag.moved = true; }
          if (drag.moved) { drag.orig.forEach(([id, x, y]) => { const c = byId(id); c.x = x + dx; c.y = y + dy; }); render(); }
        }
        else if (drag.type === 'wire') {
          const p = toWorld(e); if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
          wiring.cur = p; hoverT = nearestTerm(p[0], p[1], Math.max(9, 12 / view.k)); render();
        }
        else if (drag.type === 'via') {
          const w = doc.wires.find(x => x.id === drag.id), p = toWorld(e);
          if (w && w.via && w.via[drag.i]) { w.via[drag.i] = [snap(p[0]), snap(p[1])]; render(); }
        }
        else if (drag.type === 'mid') {
          const w = doc.wires.find(x => x.id === drag.id); const p = toWorld(e); const pp = wirePath(w);
          if (w && pp && pp.mid) { w.mid = snap(pp.mid.ax === 'v' ? p[1] : p[0]); render(); }
        }
        else if (drag.type === 'marq') { const p = toWorld(e); drag.x1 = p[0]; drag.y1 = p[1]; render(); }
        return;
      }
      if (!inside || mode === 'sim') return;
      const p = toWorld(e);
      if (tool && ghost) { ghost.x = snap(p[0]); ghost.y = snap(p[1]); render(); }
      else if (wiring) { wiring.cur = p; hoverT = nearestTerm(p[0], p[1], Math.max(9, 12 / view.k)); render(); }
      else { const h = nearestTerm(p[0], p[1], Math.max(7, 9 / view.k)); const a = h ? h.c + h.t : '', b = hoverT ? hoverT.c + hoverT.t : ''; if (a !== b) { hoverT = h; render(); } }
    });
    document.addEventListener('pointerup', e => {
      simUp();
      if (!drag) return; const d = drag; drag = null;

      else if (d.type === 'move') { if (d.moved) afterChange(); else renderPanel(); }
      else if (d.type === 'wire') {
        const p = toWorld(e);
        if (d.moved) {
          const tm = nearestTerm(p[0], p[1], Math.max(9, 12 / view.k));
          if (tm) { pushUndo(); const w = addWire(wiring.from, tm); if (w) { selW = w.id; selC = new Set(); afterChange(); } }
          wiring = null; hoverT = null; updHint(); render();
        }
        else { updHint(); render(); }
      }
      else if (d.type === 'mid' || d.type === 'via') afterChange();
      else if (d.type === 'marq') {
        const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);
        selC = new Set(doc.comps.filter(c => { const b = cbox(c); return b[2] >= x0 && b[0] <= x1 && b[3] >= y0 && b[1] <= y1; }).map(c => c.id)); selW = null; renderPanel(); render();
      }
    });
    document.addEventListener('pointercancel', () => { simUp(); drag = null; wiring = null; render(); });
    svg.addEventListener('wheel', e => { e.preventDefault(); const r = rectOf(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    svg.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;

      if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }

    });
    document.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

    /* ===== Panneau latéral ===== */
    let editing = false;
    const POTS = ['L1', 'L2', 'L3', 'N', 'PE', '24V', '0V', '+24V', '12V'];
    // Encapsule un champ de propriété dans son conteneur et son libellé.
    function field(label, inner) { return `<div class="fld"><label>${label}</label>${inner}</div>`; }
    // Génère le contrôle adapté au type d'une propriété de composant.
    function propField(c, p) {

    }
    // Génère le panneau de commandes et d'indicateurs du mode simulation.
    function simPanelHtml() {
      let h = '<h2>Simulation</h2>';
      const ops = doc.comps.filter(isOperator);
      h += '<div>' + (ops.length ? ops.map(c => {
        const lb = esc(dispLabel(c) || DEFS[c.type].name); let st = '', btn = '';

    /* ===== Export / import ===== */
    // Produit un document SVG autonome contenant le schéma courant.
    function svgText() {
      const b = [1e9, 1e9, -1e9, -1e9]; doc.comps.forEach(c => { const x = cbox(c); b[0] = Math.min(b[0], x[0] - 60); b[1] = Math.min(b[1], x[1] - 30); b[2] = Math.max(b[2], x[2] + 20); b[3] = Math.max(b[3], x[3] + 20); });
      if (b[0] > 1e8) return ''; const cs = getComputedStyle(document.documentElement);
      let css = document.querySelector('style').textContent.replace(/var\(--([a-z0-9]+)\)/g, (m, n) => cs.getPropertyValue('--' + n).trim() || '#000');
      css = css.replace(/@media[^{]*\{[\s\S]*?\}\s*\}/g, '');
      const keep = css.split('\n').filter(l => /^(\.sy|\.tl|\.cl|\.cn|\.big|\.mid|\.bus|\.wire|\.wl|\.jd|\.tm|\.lamp-on|\.rot|@keyframes)/.test(l)).join('\n');
      const bg = cs.getPropertyValue('--paper').trim();
      let inner = svg.querySelector('#world').innerHTML.replace(/<rect[^>]*url\(#g\d\)[^>]*><\/rect>/g, '').replace(/<rect class="(selbox|mh|marq)"[^>]*><\/rect>/g, '').replace(/<path class="wirehit"[^>]*><\/path>/g, '').replace(/<rect class="hit"[^>]*><\/rect>/g, '').replace(/<circle class="tm[^"]*"[^>]*><\/circle>/g, '');
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b[0]} ${b[1]} ${b[2] - b[0]} ${b[3] - b[1]}" width="${b[2] - b[0]}" height="${b[3] - b[1]}"><style>${keep}\n.wire{fill:none}</style><rect x="${b[0]}" y="${b[1]}" width="${b[2] - b[0]}" height="${b[3] - b[1]}" fill="${bg}"/>${inner}</svg>`;
    }
    // Télécharge un contenu dans un fichier local via une URL temporaire.
    function downloadFile(content, filename, type) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const link = document.createElement('a');
      link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    // Vérifie la structure d'un schéma JSON et renvoie une version prête à charger.
    function parseSchema(text) {
      const data = JSON.parse(text);
      const record = value => value !== null && typeof value === 'object' && !Array.isArray(value);
      if (!record(data) || !Array.isArray(data.comps) || !Array.isArray(data.wires)) throw new Error('Le fichier ne contient pas de schéma valide.');
      const ids = new Set();
      const comps = data.comps.map(c => {
        if (!record(c) || typeof c.id !== 'string' || !c.id || ids.has(c.id) ||
          typeof c.type !== 'string' || !Object.hasOwn(DEFS, c.type) || !Number.isFinite(c.x) || !Number.isFinite(c.y) ||
          (c.props != null && !record(c.props)) || (c.tl != null && !record(c.tl))) {
          throw new Error('Un composant du fichier est invalide ou non pris en charge.');
        }
        ids.add(c.id);
        return Object.assign({}, c, {
          rot: Number.isInteger(c.rot) ? c.rot : 0,
          label: typeof c.label === 'string' ? c.label : '',
          note: typeof c.note === 'string' ? c.note : '',
          props: Object.assign({}, DEFS[c.type].def, c.props || {}),
          tl: c.tl || {}
        });
      });
      const compById = new Map(comps.map(c => [c.id, c]));
      const wireIds = new Set();
      const wires = data.wires.map(w => {
        if (!record(w) || typeof w.id !== 'string' || !w.id || wireIds.has(w.id) ||
          !record(w.a) || !record(w.b) || typeof w.a.c !== 'string' || typeof w.a.t !== 'string' ||
          typeof w.b.c !== 'string' || typeof w.b.t !== 'string' ||
          typeof (w.label || '') !== 'string' ||
          (w.mid != null && !Number.isFinite(w.mid)) ||
          (w.via != null && (!Array.isArray(w.via) || w.via.some(p => !Array.isArray(p) || p.length !== 2 || !p.every(Number.isFinite))))) {
          throw new Error('Un fil du fichier est invalide.');
        }
        const a = compById.get(w.a.c), b = compById.get(w.b.c);
        if (!a || !b || !DEFS[a.type].terms(a).some(t => t.id === w.a.t) ||
          !DEFS[b.type].terms(b).some(t => t.id === w.b.t)) {
          throw new Error('Un fil du fichier pointe vers une borne inexistante.');
        }
        wireIds.add(w.id);
        return Object.assign({}, w, { label: w.label || '' });
      });
      const maxId = [...ids, ...wireIds].reduce((max, id) => {
        const suffix = id.match(/\d+$/);
        return suffix ? Math.max(max, Number(suffix[0])) : max;
      }, 0);
      return { comps, wires, nid: Math.max(Number.isInteger(data.nid) && data.nid > 0 ? data.nid : 1, maxId + 1) };
    }
    // Convertit le SVG courant en PNG haute résolution puis le télécharge.
    function downloadPng() {
      const source = svgText();
      if (!source) return Promise.reject(new Error('Le schéma est vide.'));
      const url = URL.createObjectURL(new Blob([source], { type: 'image/svg+xml;charset=utf-8' }));
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth * 2; canvas.height = image.naturalHeight * 2;
            const context = canvas.getContext('2d');
            if (!context) throw new Error('Impossible de créer le dessin PNG.');
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
              URL.revokeObjectURL(url);
              if (!blob) { reject(new Error('La création du fichier PNG a échoué.')); return; }
              try { downloadFile(blob, 'schema-electro.png', 'image/png'); resolve(); }
              catch (e) { reject(e); }
            }, 'image/png');
          }
          catch (e) { URL.revokeObjectURL(url); reject(e); }
        };
        image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Le dessin SVG ne peut pas être converti en PNG.')); };
        image.src = url;
      });
    }

    const P = (type, x, y, label, p, o) => addComp(type, x, y, Object.assign({ label, p }, o || {}));
    // Relie deux composants dans un schéma d'exemple.
    const W = (a, ta, b, tb, o) => addWire({ c: a.id, t: ta }, { c: b.id, t: tb }, o);
    // Relie les trois pôles correspondants de deux appareils triphasés.
    const chain3 = (a, b, ta, tb) => { [0, 1, 2].forEach(i => W(a, String(2 * i + (ta || 2)), b, String(2 * i + (tb || 1)))); };
    // Remplace les repères de bornes d'un composant d'exemple.
    const lab = (c, tl) => { c.tl = tl; return c; };
    // Ajoute les composants communs d'alimentation d'un exemple de circuit.
    function powerHead() {
      const src = P('src3', 100, 40, '', { txt: '3~ 400 V 50 Hz' });
      const q1 = P('sect', 100, 100, 'Q1', { n: 3 }, { note: 'Sectionneur' }); const f1 = P('fuse', 100, 190, 'F1', { n: 3, cal: 16 });
      W(src, 'l1', q1, '1'); W(src, 'l2', q1, '3'); W(src, 'l3', q1, '5'); chain3(q1, f1); return { src, q1, f1 };
    }
    // Construit l'exemple de démarrage direct d'un moteur triphasé.
    function exDirect() {
      const { src, f1 } = powerHead();
      const km = P('kmp', 100, 280, '', { n: 3, ref: 'KM1' }); const f2 = P('thermal', 100, 370, 'F2', {});
      const m1 = P('mot3', 120, 460, 'M1', {}, { note: '1,5 kW' });
      chain3(f1, km); chain3(km, f2); W(f2, '2', m1, 'u1'); W(f2, '4', m1, 'v1'); W(f2, '6', m1, 'w1');
      W(src, 'pe', m1, 'pe', { via: [[180, 50], [180, 500]] });
      const f3 = P('fuse', 320, 290, 'F3', { n: 2, cal: 2 }, { note: 'Commande' });
      W(f1, '2', f3, '1', { mid: 275 }); W(f1, '4', f3, '3', { mid: 265 });
      const s0 = P('btn', 320, 390, 'S0', { type: 'nc' }, { note: 'Arrêt' }), s1 = P('btn', 320, 480, 'S1', { type: 'no' }, { note: 'Marche' });
      const ka = P('ctc', 380, 480, '', { kind: 'aux', type: 'no', ref: 'KM1' }), th = P('ctc', 320, 570, '', { kind: 'th', type: 'nc', ref: 'F2' });
      const kc = P('coil', 320, 660, 'KM1', {});
      W(f3, '2', s0, 'a'); W(s0, 'b', s1, 'a'); W(s0, 'b', ka, 'a', { mid: 465 }); W(s1, 'b', th, 'a'); W(ka, 'b', th, 'a', { mid: 555 }); W(th, 'b', kc, 'a1');
      const c1 = lab(P('ctc', 440, 480, '', { kind: 'aux', type: 'no', ref: 'KM1' }), { a: '43', b: '44' }), h1 = P('lamp', 440, 570, 'H1', { color: 'vert' }, { note: 'Marche' });
      const c2 = P('ctc', 500, 480, '', { kind: 'th', type: 'no', ref: 'F2' }), h2 = P('lamp', 500, 570, 'H2', { color: 'rouge' }, { note: 'Défaut' });
      W(f3, '2', c1, 'a', { mid: 370 }); W(f3, '2', c2, 'a', { mid: 370 }); W(c1, 'b', h1, 'x1'); W(c2, 'b', h2, 'x1');
      const ja = P('node', 500, 750, ''), jb = P('node', 440, 750, '');
      W(f3, '4', ja, 'o', { via: [[340, 360], [540, 360], [540, 750]] }); W(ja, 'o', jb, 'o'); W(jb, 'o', kc, 'a2'); W(h1, 'x2', jb, 'o'); W(h2, 'x2', ja, 'o');
    }
    // Construit l'exemple d'inversion du sens de rotation d'un moteur.
    function exReverse() {
      const { src, f1 } = powerHead();
      const k1 = P('kmp', 100, 300, '', { n: 3, ref: 'KM1' }), k2 = P('kmp', 200, 300, '', { n: 3, ref: 'KM2' });
      const f2 = P('thermal', 100, 420, 'F2', {}), m1 = P('mot3', 120, 550, 'M1', {}, { note: '1,5 kW' });
      chain3(f1, k1); W(f1, '2', k2, '1', { mid: 285 }); W(f1, '4', k2, '3', { mid: 275 }); W(f1, '6', k2, '5', { mid: 265 });
      chain3(k1, f2); W(k2, '2', f2, '1', { mid: 380 }); W(k2, '4', f2, '5', { mid: 390 }); W(k2, '6', f2, '3', { mid: 400 });
      W(f2, '2', m1, 'u1'); W(f2, '4', m1, 'v1'); W(f2, '6', m1, 'w1');
      W(src, 'pe', m1, 'pe', { via: [[180, 50], [290, 50], [290, 590]] });
      const f3 = P('fuse', 360, 300, 'F3', { n: 2, cal: 2 }, { note: 'Commande' });
      W(f1, '2', f3, '1', { mid: 285 }); W(f1, '4', f3, '3', { mid: 275 });
      const s0 = P('btn', 360, 400, 'S0', { type: 'nc' }, { note: 'Arrêt' });
      const s1 = P('btn', 360, 490, 'S1', { type: 'no' }, { note: 'Marche G' }), a1 = P('ctc', 420, 490, '', { kind: 'aux', type: 'no', ref: 'KM1' });
      const s2 = P('btn', 520, 490, 'S2', { type: 'no' }, { note: 'Marche D' }), a2 = P('ctc', 580, 490, '', { kind: 'aux', type: 'no', ref: 'KM2' });
      const i1 = lab(P('ctc', 360, 580, '', { kind: 'aux', type: 'nc', ref: 'KM2' }), { a: '21', b: '22' }), i2 = lab(P('ctc', 520, 580, '', { kind: 'aux', type: 'nc', ref: 'KM1' }), { a: '21', b: '22' });
      const c1 = P('coil', 360, 670, 'KM1', {}), c2 = P('coil', 520, 670, 'KM2', {});
      W(f3, '2', s0, 'a'); W(s0, 'b', s1, 'a'); W(s0, 'b', a1, 'a', { mid: 475 }); W(s0, 'b', s2, 'a', { mid: 475 }); W(s0, 'b', a2, 'a', { mid: 475 });
      W(s1, 'b', i1, 'a'); W(a1, 'b', i1, 'a', { mid: 565 }); W(s2, 'b', i2, 'a'); W(a2, 'b', i2, 'a', { mid: 565 });
      W(i1, 'b', c1, 'a1'); W(i2, 'b', c2, 'a1');
      const jn = P('node', 440, 760, ''); W(c1, 'a2', jn, 'o'); W(c2, 'a2', jn, 'o');
      const fc = P('ctc', 440, 790, '', { kind: 'th', type: 'nc', ref: 'F2' }); W(jn, 'o', fc, 'a');
      W(f3, '4', fc, 'b', { via: [[640, 360], [640, 870], [440, 870]] });
    }
    // Construit l'exemple de démarrage étoile-triangle.
    function exStarDelta() {
      const { src, f1 } = powerHead();
      const k1 = P('kmp', 100, 280, '', { n: 3, ref: 'KM1' }), f2 = P('thermal', 100, 370, 'F2', {});
      const m1 = P('mot3b', 120, 540, 'M1', {}, { note: '400/690 V' });
      const k3 = P('kmp', 300, 470, '', { n: 3, ref: 'KM3' }), k2 = P('kmp', 100, 620, '', { n: 3, ref: 'KM2' });
      chain3(f1, k1); chain3(k1, f2); W(f2, '2', m1, 'u1'); W(f2, '4', m1, 'v1'); W(f2, '6', m1, 'w1');
      W(f2, '2', k3, '1', { mid: 455 }); W(f2, '4', k3, '3', { mid: 450 }); W(f2, '6', k3, '5', { mid: 445 });
      W(m1, 'w2', k2, '1'); W(m1, 'u2', k2, '3'); W(m1, 'v2', k2, '5');
      W(k3, '2', k2, '1', { mid: 590 }); W(k3, '4', k2, '3', { mid: 600 }); W(k3, '6', k2, '5', { mid: 610 });
      W(k2, '2', k2, '4'); W(k2, '4', k2, '6');
      W(src, 'pe', m1, 'pe', { via: [[180, 50], [180, 540]] });
      const f3 = P('fuse', 460, 300, 'F3', { n: 2, cal: 2 }, { note: 'Commande' });
      W(f1, '2', f3, '1', { mid: 275 }); W(f1, '4', f3, '3', { mid: 265 });
      const s0 = P('btn', 460, 400, 'S0', { type: 'nc' }, { note: 'Arrêt' }), s1 = P('btn', 460, 490, 'S1', { type: 'no' }, { note: 'Marche' });
      const ka = P('ctc', 520, 490, '', { kind: 'aux', type: 'no', ref: 'KM1' }), th = P('ctc', 460, 580, '', { kind: 'th', type: 'nc', ref: 'F2' }), kc1 = P('coil', 460, 670, 'KM1', {});
      W(f3, '2', s0, 'a'); W(s0, 'b', s1, 'a'); W(s0, 'b', ka, 'a', { mid: 475 }); W(s1, 'b', th, 'a'); W(ka, 'b', th, 'a', { mid: 565 }); W(th, 'b', kc1, 'a1');
      const kb = lab(P('ctc', 600, 400, '', { kind: 'aux', type: 'no', ref: 'KM1' }), { a: '53', b: '54' }); W(f3, '2', kb, 'a', { mid: 370 });
      const i3 = P('ctc', 600, 490, '', { kind: 'aux', type: 'nc', ref: 'KM3' }); W(kb, 'b', i3, 'a');
      const jb = P('node', 600, 570, ''); W(i3, 'b', jb, 'o');
      const kt = P('coilt', 600, 640, 'KT1', { delay: 5 }), tn = P('ctc', 660, 610, '', { kind: 'tmp', type: 'nc', ref: 'KT1' }), kc2 = P('coil', 660, 700, 'KM2', {});
      W(jb, 'o', kt, 'a1'); W(jb, 'o', tn, 'a'); W(tn, 'b', kc2, 'a1');
      const to = P('ctc', 740, 490, '', { kind: 'tmp', type: 'no', ref: 'KT1' }), k3a = lab(P('ctc', 800, 490, '', { kind: 'aux', type: 'no', ref: 'KM3' }), { a: '43', b: '44' });
      const i2 = P('ctc', 740, 580, '', { kind: 'aux', type: 'nc', ref: 'KM2' }), kc3 = P('coil', 740, 670, 'KM3', {});
      W(kb, 'b', to, 'a', { mid: 475 }); W(kb, 'b', k3a, 'a', { mid: 475 }); W(to, 'b', i2, 'a'); W(k3a, 'b', i2, 'a', { mid: 565 }); W(i2, 'b', kc3, 'a1');
      const n1 = P('node', 460, 820, ''), nt = P('node', 600, 820, ''), n2 = P('node', 660, 820, ''), n3 = P('node', 740, 820, '');
      W(kc1, 'a2', n1, 'o'); W(kt, 'a2', nt, 'o'); W(kc2, 'a2', n2, 'o'); W(kc3, 'a2', n3, 'o');
      W(n1, 'o', nt, 'o'); W(nt, 'o', n2, 'o'); W(n2, 'o', n3, 'o');
      W(f3, '4', n3, 'o', { via: [[900, 360], [900, 820]] });
    }
    // Construit l'exemple d'un circuit de moteur monophasé.
    function exSingle() {
      const src = P('src1', 100, 40, '', { txt: '1~ 230 V 50 Hz' });
      const q1 = P('disj', 100, 100, 'Q1', { n: 2, cal: 16 }, { note: 'Disjoncteur 16 A' }), km = P('kmp', 100, 190, '', { n: 2, ref: 'KM1' });
      const m1 = P('mot1', 110, 290, 'M1', {}, { note: '0,75 kW' });
      W(src, 'l1', q1, '1'); W(src, 'n', q1, '3'); W(q1, '2', km, '1'); W(q1, '4', km, '3'); W(km, '2', m1, 'u1'); W(km, '4', m1, 'u2');
      W(src, 'pe', m1, 'pe', { via: [[140, 50], [170, 50], [170, 330]] });
      const s0 = P('btn', 300, 220, 'S0', { type: 'nc' }, { note: 'Arrêt' }), s1 = P('btn', 300, 310, 'S1', { type: 'no' }, { note: 'Marche' });
      const ka = P('ctc', 360, 310, '', { kind: 'aux', type: 'no', ref: 'KM1' }), kc = P('coil', 300, 400, 'KM1', {});
      const k2 = lab(P('ctc', 440, 310, '', { kind: 'aux', type: 'no', ref: 'KM1' }), { a: '23', b: '24' }), h1 = P('lamp', 440, 400, 'H1', { color: 'vert' }, { note: 'Marche' });
      W(q1, '2', s0, 'a', { mid: 180 }); W(q1, '2', k2, 'a', { mid: 180 });
      W(s0, 'b', s1, 'a'); W(s0, 'b', ka, 'a', { mid: 295 }); W(s1, 'b', kc, 'a1'); W(ka, 'b', kc, 'a1', { mid: 385 }); W(k2, 'b', h1, 'x1');
      const j1 = P('node', 300, 540, ''), j2 = P('node', 440, 540, '');
      W(kc, 'a2', j1, 'o'); W(h1, 'x2', j2, 'o'); W(j1, 'o', j2, 'o');
      W(q1, '4', j2, 'o', { via: [[120, 170], [560, 170], [560, 540]] });
    }
    const EXAMPLES = [
      ['Démarrage direct, un sens (3~)', 'Sectionneur, fusibles, contacteur, relais thermique, marche/arrêt avec voyants', exDirect],
      ['Inversion de sens de rotation (3~)', 'Deux contacteurs, verrouillage électrique par contacts NC', exReverse],
      ['Démarrage étoile-triangle (3~)', 'Moteur à 6 bornes, trois contacteurs, relais temporisé', exStarDelta],
      ['Moteur monophasé (1~)', 'Disjoncteur 2P, contacteur, marche/arrêt avec voyant', exSingle]];
    // Remplace le schéma courant par l'exemple choisi et l'ajuste à l'écran.
    function loadExample(i) { if (mode === 'sim') setMode('edit'); pushUndo(); doc = { comps: [], wires: [], nid: 1 }; selC = new Set(); selW = null; EXAMPLES[i][2](); autoNumber(true); fit(); renderPanel(); }
    $('#mEx').innerHTML = EXAMPLES.map((x, i) => `<button type="button" data-ex="${i}">${x[0]}<small>${x[1]}</small></button>`).join('');
    $('#bEx').onclick = e => { e.stopPropagation(); $('#mEx').hidden = !$('#mEx').hidden; };
    $('#mEx').addEventListener('click', e => { const b = e.target.closest('[data-ex]'); if (!b) return; $('#mEx').hidden = true; loadExample(+b.dataset.ex); });
    document.addEventListener('click', e => { if (!e.target.closest('.menu')) $('#mEx').hidden = true; });
    window.addEventListener('resize', () => render());

    /* ===== Démarrage ===== */
    // Initialise l'interface, restaure le dernier schéma ou charge l'exemple par défaut.
    (function init() {
      buildPalette(); updBtns(); updHint();
      let ok = false; try { const j = localStorage.getItem('schema-electro-v1'); if (j) { const o = JSON.parse(j); if (o && o.comps && o.comps.length && o.comps.every(c => DEFS[c.type])) { doc = { comps: o.comps, wires: o.wires || [], nid: o.nid || 1 }; ok = true; } } } catch (e) { }
      if (!ok) { EXAMPLES[0][2](); autoNumber(true); }
      renderPanel(); requestAnimationFrame(() => { fit(); });
    })();
  </script>
  <script>
    (() => {
      const installButton = document.querySelector('#bInstall');
      let installPrompt = null;
      const isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      if (isInstalled) installButton.hidden = true;

      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        installPrompt = event;
      });

      window.addEventListener('appinstalled', () => {
        installPrompt = null;
        installButton.hidden = true;
      });

      installButton.addEventListener('click', async () => {
        if (!installPrompt) {
          const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
          alert(isIOS
            ? 'Pour installer cette application, ouvrez le menu Partager de Safari puis choisissez « Sur l’écran d’accueil ».'
            : 'Pour installer cette application, utilisez la commande « Installer l’application » ou « Ajouter à l’écran d’accueil » du menu de votre navigateur. L’application doit être ouverte depuis HTTPS ou localhost.');
          return;
        }

        const prompt = installPrompt;
        installPrompt = null;
        try {
          await prompt.prompt();
          const { outcome } = await prompt.userChoice;
          if (outcome === 'accepted') installButton.hidden = true;
        } catch (error) {
          console.error('Impossible de lancer l’installation de Schemelec.', error);
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .catch(error => console.error('Impossible d’activer le mode hors ligne de Schemelec.', error));
        });
      }
    })();
  </script>
